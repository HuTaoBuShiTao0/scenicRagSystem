# 业务配置
app:
  jwt-secret: luoyang-scenic-rag-system-jwt-secret-key-2024
  # 知识库类型列表
  knowledge-types: scenic,attraction,food,hotel,product,ticket,fixed_qa,customer_service
  # RAG检索匹配阈值（score = 1 - L2距离，0.50 ≈ L2<0.5）
