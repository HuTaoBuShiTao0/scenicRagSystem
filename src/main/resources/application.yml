  api-key: e7f818e334c94ffca6c6b479778edab1.FLePaYLg3U1kSO1W
  model: glm-4.5-air
  embedding-model: text_embedding_v3
  base-url: https://open.bigmodel.cn/api/paas/v4

# Chroma 向量数据库配置
